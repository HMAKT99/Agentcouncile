services:
  db:
    image: postgres:16-alpine
    container_name: agentcouncil-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentcouncil
      POSTGRES_PASSWORD: agentcouncil_secret
      POSTGRES_DB: agentcouncil
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentcouncil"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: agentcouncil-web
    restart: unless-stopped
    ports:
      - "3333:3000"
    environment:
      DATABASE_URL: "postgresql://agentcouncil:agentcouncil_secret@db:5432/agentcouncil?schema=public"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
