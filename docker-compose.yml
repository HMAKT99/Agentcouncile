services:
  db:
    image: postgres:16-alpine
    container_name: agentcouncil-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentcouncil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentcouncil_secret}
      POSTGRES_DB: ${POSTGRES_DB:-agentcouncil}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentcouncil}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: agentcouncil-web
    restart: unless-stopped
    ports:
      - "${PORT:-3333}:3000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-agentcouncil}:${POSTGRES_PASSWORD:-agentcouncil_secret}@db:5432/${POSTGRES_DB:-agentcouncil}?schema=public"
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://agentcouncil.ai}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
